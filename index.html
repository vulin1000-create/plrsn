                  <div class="level-card ${isUnlocked ? '' : 'locked'}" onclick="${isUnlocked ? `startLevel(${lvl.num})` : `notifyLevelLocked(${lvl.num})`}">
                    <div class="level-icon-badge">${isUnlocked ? lvl.icon : '🔒'}</div>
                    <div class="level-info">
                      <div class="level-title">
                        <span>${lvl.title}</span>
                        <span style="font-size: 0.72rem; padding: 2px 6px; border-radius: 8px; font-weight: 700; ${isUnlocked ? 'background: #DCFCE7; color: #15803D;' : 'background: #E5E7EB; color: #6B7280;'}">
                          ${isUnlocked ? 'Đã mở' : 'Khóa 🔒'}
                        </span>
                      </div>
                      <div class="level-desc">${lvl.desc}</div>
                      <div class="level-stars-display">
                        ${isUnlocked ? renderStars(lvl.num) : `<span style="color: #9CA3AF; font-size: 0.8rem;">Qua Cấp ${lvl.num - 1} để mở</span>`}
                      </div>
                    </div>
                    <button class="${isUnlocked ? 'btn-primary' : 'btn-secondary'}" 
                            style="padding: 8px 14px; font-size: 0.9rem; min-height: 38px;"
                            ${isUnlocked ? '' : 'disabled'}>
                      ${isUnlocked ? 'Chơi ▶️' : 'Khóa 🔒'}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Danh sách huy hiệu của bé -->
            <div style="background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 16px; padding: 10px 12px; margin-top: 10px; text-align: left;">
              <div style="font-weight: 800; font-size: 0.9rem; color: #334155; margin-bottom: 6px;">
                🎖️ Huy hiệu của bé:
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                <span class="badge-pill" style="${progress.badges && progress.badges.includes('newbie') ? '' : 'opacity: 0.4; filter: grayscale(1);'}">
                  🌱 Người mới (xong 1 lượt)
                </span>
                <span class="badge-pill" style="${progress.badges && progress.badges.includes('friend_of_env') ? '' : 'opacity: 0.4; filter: grayscale(1);'}">
                  🌿 Bạn của môi trường (qua Cấp 1)
                </span>
                <span class="badge-pill" style="${progress.badges && progress.badges.includes('super_sorter') ? '' : 'opacity: 0.4; filter: grayscale(1);'}">
                  🌟 Siêu phân loại (qua Cấp 5)
                </span>
                <span class="badge-pill" style="${progress.badges && progress.badges.includes('green_warrior') ? '' : 'opacity: 0.4; filter: grayscale(1);'}">
                  🛡️ Chiến binh xanh (qua Cấp 6)
                </span>
              </div>
            </div>

            <div style="margin-top: 12px;">
              <button class="btn-secondary" onclick="goToHome()">
                🏠 Về Trang Chủ
              </button>
            </div>
          </div>
        `;
      }

      function notifyLevelLocked(lvl) {
        initAudio();
        playSoundWrong();
        showToast(`🔒 Cấp ${lvl} đang khóa! Bé cần đúng từ ${lvl === 2 ? '7/10' : '10/12'} câu ở Cấp ${lvl - 1} để mở khóa nhé!`);
      }

      // 3. Màn hình Chơi Game & Cấp 6 Tốc Độ
      function renderPlayingScreen() {
        const item = appState.roundItems[appState.currentIndex];
        if (!item) return '<div>Đang tải câu hỏi...</div>';

        const totalItems = appState.roundItems.length;
        const currentNum = appState.currentIndex + 1;
        const progressPercent = Math.round((appState.currentIndex / totalItems) * 100);
        const isTestMode = appState.gameMode === 'kiemtra_truoc' || appState.gameMode === 'kiemtra_sau';
        const isLevel6 = appState.currentLevel === 6 && appState.gameMode === 'choi';

        const levelTitles = {
          1: '🌱 Cấp 1: Làm quen',
          2: '⚡ Cấp 2: Rác dễ nhầm',
          3: '🍳 Cấp 3: Nhà bếp',
          4: '📚 Cấp 4: Góc học tập',
          5: '🌳 Cấp 5: Ngoài trời',
          6: '⏱️ Cấp 6: Thử thách thời gian'
        };

        return `
          <div class="game-container">
            <div class="status-bar">
              <div class="progress-container">
                <div class="progress-label">
                  <span>Câu ${currentNum}/${totalItems}</span>
                  <span style="font-weight: 800; color: ${isTestMode ? '#D97706' : '#059669'};">
                    ${isTestMode ? `📝 Bài kiểm tra (${appState.testSet})` : levelTitles[appState.currentLevel]}
                  </span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="width: ${progressPercent}%;"></div>
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 8px;">
                ${!isTestMode && appState.streak >= 2 ? `
                  <div class="combo-badge">
                    🔥 Chuỗi ${appState.streak}
                  </div>
                ` : ''}

                <div class="score-box">
                  <span>⭐</span>
                  <span style="font-weight: 800;">${appState.score}</span>
                </div>
              </div>
            </div>

            <!-- Thanh đếm ngược & mạng chỉ có ở Cấp 6 -->
            ${isLevel6 ? `
              <div class="speed-bar-container">
                <div class="lives-display">
                  <span>Mạng:</span>
                  <span>${'❤️'.repeat(Math.max(0, appState.lives))}${'🖤'.repeat(Math.max(0, 3 - appState.lives))}</span>
                </div>
                <div class="timer-display">
                  <span>⏱️ Thời gian:</span>
                  <span id="level6-timer-val" style="color: #B45309; font-size: 1.25rem;">${appState.remainingTime}s</span>
                </div>
                <div style="font-size: 0.78rem; color: #78350F;">
                  ⚡ <3s: +5đ
                </div>
              </div>
            ` : ''}

            <!-- Banner phản hồi -->
            ${appState.lastSuccessMessage ? `
              <div style="background: #DCFCE7; border: 2px solid #16A34A; border-radius: 14px; padding: 8px 12px; color: #166534; font-weight: 700; font-size: 0.95rem; animation: fadeIn 0.2s;">
                <span>${appState.lastSuccessMessage}</span>
              </div>
            ` : ''}

            <!-- Sân khấu món rác -->
            <div class="waste-stage" id="waste-drop-stage">
              <div class="waste-item-card" id="waste-card-el" draggable="true" title="Kéo món rác hoặc bấm vào thùng bên dưới">
                <div class="waste-illustration-box">
                  ${renderWasteItemGraphic(item, 110)}
                </div>
                <div class="waste-title">${item.name}</div>
                <div class="waste-meta-row">
                  <span class="waste-category">${item.category}</span>
                  ${!isTestMode ? `
                    <span class="waste-difficulty-badge ${item.difficulty === 'hard' ? 'diff-hard' : 'diff-easy'}">
                      ${item.difficulty === 'hard' ? '⚡ Món khó' : '🌱 Món dễ'}
                    </span>
                  ` : ''}
                </div>
              </div>

              <div class="drag-instruction">
                👉 Kéo món rác hoặc <b>chạm/bấm vào 1 trong 3 thùng</b> bên dưới nhé!
              </div>
            </div>

            <!-- 3 Thùng Rác Chuẩn -->
            <div class="bins-grid">
              <div class="bin-target ${BINS.recycle.bgClass}" 
                   id="bin-target-recycle" 
                   data-bin="recycle" 
                   onclick="handleChooseBin('recycle')">
                <div class="bin-icon">${BINS.recycle.emoji}</div>
                <div class="bin-name">${BINS.recycle.shortName}</div>
                <div class="bin-hint-text">${BINS.recycle.guide}</div>
              </div>

              <div class="bin-target ${BINS.organic.bgClass}" 
                   id="bin-target-organic" 
                   data-bin="organic" 
                   onclick="handleChooseBin('organic')">
                <div class="bin-icon">${BINS.organic.emoji}</div>
                <div class="bin-name">${BINS.organic.shortName}</div>
                <div class="bin-hint-text">${BINS.organic.guide}</div>
              </div>

              <div class="bin-target ${BINS.residual.bgClass}" 
                   id="bin-target-residual" 
                   data-bin="residual" 
                   onclick="handleChooseBin('residual')">
                <div class="bin-icon">${BINS.residual.emoji}</div>
                <div class="bin-name">${BINS.residual.shortName}</div>
                <div class="bin-hint-text">${BINS.residual.guide}</div>
              </div>
            </div>
          </div>
        `;
      }

      // 4. Thẻ Giải Thích Khi Sai
      function renderExplanationModal(data) {
        const item = data.item;
        const correctBin = BINS[data.correctBin];

        return `
          <div class="explanation-modal-backdrop">
            <div class="explanation-card">
              <div class="explanation-header">
                <span style="font-size: 1.6rem;">🐢</span>
                <span>Ồ, Chúng Mình Cùng Xem Nhé!</span>
              </div>

              <div class="explanation-item-box">
                <div class="explanation-illustration-box">
                  ${renderWasteItemGraphic(item, 80)}
                </div>
                <div class="explanation-item-text">
                  <div class="explanation-item-name">${item.name}</div>
                  <div class="explanation-item-material">
                    Nhóm vật liệu: <b>${item.category}</b>
                  </div>
                </div>
              </div>

              <div style="font-size: 0.92rem; font-weight: 700; color: #4B5563; margin-bottom: 6px;">
                Món này thuộc về thùng:
              </div>
              <div class="explanation-correct-bin ${correctBin.bgClass}">
                <span style="font-size: 2rem;">${correctBin.emoji}</span>
                <span>${correctBin.name}</span>
              </div>

              <div class="explanation-reason">
                💡 <b>Giải thích:</b> ${item.explanation}
                ${item.note ? `<span class="explanation-note-tag">📌 ${item.note}</span>` : ''}
              </div>

              <button class="btn-primary" onclick="closeExplanationCard()" style="font-size: 1.15rem; padding: 14px 28px; width: 100%;">
                👍 Mình hiểu rồi!
              </button>
            </div>
          </div>
        `;
      }

      // 5. Màn hình Kết Quả
      function renderResultScreen() {
        const total = appState.roundItems.length;
        const correct = appState.correctCount;
        const isTestMode = appState.gameMode === 'kiemtra_truoc' || appState.gameMode === 'kiemtra_sau';
        const levelNum = appState.currentLevel;

        if (isTestMode) {
          return `
            <div class="card-box" style="max-width: 480px; margin: auto;">
              <div style="font-size: 3.5rem;">🎉</div>
              <h2 style="font-size: 1.6rem; font-weight: 800; color: #065F46; margin-top: 4px; line-height: 1.35;">
                Đã Hoàn Thành Bài Kiểm Tra!
              </h2>
              <p style="color: #4B5563; font-size: 0.95rem; margin: 10px 0; line-height: 1.4;">
                Bé <b>${escapeHtml(appState.user.nickname)}</b> đã hoàn thành bài khảo sát <b>${appState.gameMode === 'kiemtra_truoc' ? 'Trước khi học' : 'Sau khi chơi'} (Bộ đề ${appState.testSet})</b>.
              </p>

              <div class="result-stats" style="grid-template-columns: 1fr;">
                <div class="stat-item">
                  <span class="stat-num">${appState.score} / 120 điểm</span>
                  <span class="stat-label">Tổng điểm đạt được</span>
                </div>
              </div>

              <div class="turtle-speech" style="margin: 12px auto; max-width: 100%;">
                🐢 "Cảm ơn bé đã hoàn thành bài khảo sát trung thực! Kết quả này giúp nhóm nghiên cứu chứng minh hiệu quả bảo vệ môi trường của chúng mình đấy!"
              </div>

              <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px;">
                <button class="btn-primary" onclick="goToHome()">
                  🏠 Về Trang Chủ
                </button>
                <button class="btn-secondary" onclick="goToComparePrePost()">
                  📈 Xem Bảng So Sánh Trước/Sau
                </button>
              </div>
            </div>
          `;
        }

        const ratio = total > 0 ? (correct / total) : 0;
        let stars = 0;
        let isPassed = false;
        let turtleCheer = '';

        if (levelNum === 1 && correct >= 7) isPassed = true;
        else if (levelNum >= 2 && levelNum <= 5 && correct >= 10) isPassed = true;
        else if (levelNum === 6 && correct >= 11 && appState.lives > 0) isPassed = true;

        if (isPassed) {
          if (correct === total || ratio > 0.95) stars = 3;
          else if (ratio > 0.8) stars = 2;
          else stars = 1;

          if (levelNum === 6) {
            turtleCheer = 'PHI THƯỜNG! Bé đã vượt qua Cấp 6 Thử Thách Thời Gian và trở thành Chiến Binh Xanh đích thực! 🛡️';
          } else {
            turtleCheer = `Chúc mừng bé đã hoàn thành Cấp ${levelNum}! Cấp tiếp theo đã chính thức mở khóa! 🌟`;
          }
        } else {
          turtleCheer = `Bé đừng buồn nhé! Hãy cùng Rùa Xanh chơi lại để đạt chuẩn qua Cấp ${levelNum} nha! 💪`;
        }

        const badgeNames = {
          newbie: '🌱 Người mới',
          friend_of_env: '🌿 Bạn của môi trường',
          super_sorter: '🌟 Siêu phân loại',
          green_warrior: '🛡️ Chiến binh xanh'
        };

        const currentProgress = getUserProgress(appState.user.nickname);

        return `
          <div class="card-box" style="max-width: 480px; margin: auto;">
            <div style="font-size: 3rem;">${isPassed ? '🎉' : '💪'}</div>
            <h2 style="font-size: 1.55rem; font-weight: 800; color: #065F46; margin-top: 4px; line-height: 1.35;">
              ${isPassed ? `Hoàn Thành Cấp ${levelNum}!` : `Cố Gắng Lên Bé Ơi!`}
            </h2>

            <div class="stars-container">
              <span class="star-icon ${stars >= 1 ? 'active' : ''}">★</span>
              <span class="star-icon ${stars >= 2 ? 'active' : ''}">★</span>
              <span class="star-icon ${stars >= 3 ? 'active' : ''}">★</span>
            </div>

            <!-- Huy hiệu -->
            <div style="display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 8px 0;">
              ${appState.newBadgesEarned.length > 0 ? `
                ${appState.newBadgesEarned.map(b => `
                  <div class="badge-pill newly-earned">
                    ✨ Mới nhận: ${badgeNames[b] || b}
                  </div>
                `).join('')}
              ` : `
                ${(currentProgress.badges || []).map(b => `
                  <div class="badge-pill">
                    ${badgeNames[b] || b}
                  </div>
                `).join('')}
              `}
            </div>

            <div class="result-stats">
              <div class="stat-item">
                <span class="stat-num">${correct}/${total}</span>
                <span class="stat-label">Số câu đúng</span>
              </div>
              <div class="stat-item">
                <span class="stat-num">${appState.score}</span>
                <span class="stat-label">Tổng điểm (+20 hoàn thành)</span>
              </div>
              <div class="stat-item">
                <span class="stat-num">${appState.maxStreak}</span>
                <span class="stat-label">Chuỗi đúng dài nhất</span>
              </div>
              <div class="stat-item">
                <span class="stat-num" style="color: ${isPassed ? '#16A34A' : '#DC2626'};">${isPassed ? 'ĐẠT' : 'CHƯA ĐẠT'}</span>
                <span class="stat-label" style="font-weight: 700;">
                  Ngưỡng: ${levelNum === 6 ? '≥ 11/14' : (levelNum === 1 ? '≥ 7/10' : '≥ 10/12')}
                </span>
              </div>
            </div>

            <div class="turtle-speech" style="margin: 10px auto; max-width: 100%;">
              🐢 "${turtleCheer}"
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px;">
              <button class="btn-primary" onclick="${isPassed && levelNum < 6 ? `startLevel(${levelNum + 1})` : `startLevel(${levelNum})`}">
                ${isPassed && levelNum < 6 ? `⚡ Tiến lên Cấp ${levelNum + 1} ngay!` : `🔄 Chơi lại Cấp ${levelNum}`}
              </button>

              <button class="btn-secondary" onclick="goToLevelSelect()">
                🗺️ Màn chọn cấp độ
              </button>

              <button class="btn-secondary" onclick="goToHome()">
                🏠 Về Trang Chủ
              </button>
            </div>
          </div>
        `;
      }

      // 6. Màn hình Rác Hay Nhầm (V4)
      function renderConfusedWasteScreen() {
        const stats = computeConfusedStats(appState.confusedFilterLevel, appState.confusedFilterGroup);
        const storedAnswers = getStoredAnswers().filter(a => a.mode === 'choi');
        const uniqueGroups = Array.from(new Set(storedAnswers.map(a => a.group || 'Chưa có'))).filter(Boolean);

        return `
          <div class="card-box" style="max-width: 620px; margin: auto;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
              <h2 style="font-size: 1.45rem; font-weight: 800; color: #065F46; text-align: left; line-height: 1.35;">
                📊 Rác Hay Nhầm Nhất
              </h2>
              <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.85rem; min-height: 36px;" onclick="goToHome()">
                🏠 Trang chủ
              </button>
            </div>

            <!-- Bộ lọc Cấp độ & Lớp -->
            <div class="filter-bar">
              <span style="font-size: 0.85rem; font-weight: 700; color: #4B5563;">Cấp độ:</span>
              <button class="filter-chip ${appState.confusedFilterLevel === 'all' ? 'active' : ''}" onclick="setConfusedFilterLevel('all')">Tất cả</button>
              <button class="filter-chip ${appState.confusedFilterLevel === '1' ? 'active' : ''}" onclick="setConfusedFilterLevel('1')">Cấp 1</button>
              <button class="filter-chip ${appState.confusedFilterLevel === '2' ? 'active' : ''}" onclick="setConfusedFilterLevel('2')">Cấp 2</button>
              <button class="filter-chip ${appState.confusedFilterLevel === '3' ? 'active' : ''}" onclick="setConfusedFilterLevel('3')">Cấp 3</button>
              <button class="filter-chip ${appState.confusedFilterLevel === '4' ? 'active' : ''}" onclick="setConfusedFilterLevel('4')">Cấp 4</button>
              <button class="filter-chip ${appState.confusedFilterLevel === '5' ? 'active' : ''}" onclick="setConfusedFilterLevel('5')">Cấp 5</button>
              <button class="filter-chip ${appState.confusedFilterLevel === '6' ? 'active' : ''}" onclick="setConfusedFilterLevel('6')">Cấp 6</button>
            </div>

            ${uniqueGroups.length > 1 ? `
              <div class="filter-bar">
                <span style="font-size: 0.85rem; font-weight: 700; color: #4B5563;">Lớp/Tổ:</span>
                <select onchange="setConfusedFilterGroup(this.value)" style="padding: 6px 10px; border-radius: 12px; border: 2px solid #CBD5E1; font-weight: 700; font-size: 0.85rem; font-family: var(--font-family);">
                  <option value="all" ${appState.confusedFilterGroup === 'all' ? 'selected' : ''}>Tất cả các lớp</option>
                  ${uniqueGroups.map(g => `<option value="${escapeHtml(g)}" ${appState.confusedFilterGroup === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
                </select>
              </div>
            ` : ''}

            <!-- Nhận xét tự động -->
            <div style="background: #FEF3C7; border: 2px solid #F59E0B; border-radius: 16px; padding: 10px 14px; font-weight: 700; font-size: 0.95rem; color: #92400E; margin: 10px 0; text-align: left; line-height: 1.4;">
              🐢 <b>Nhận xét tự động:</b> ${stats.autoComment}
            </div>

            <div style="font-size: 0.78rem; color: #64748B; margin-bottom: 10px; text-align: left; line-height: 1.35;">
              ℹ️ <i>Chỉ xếp hạng các món có từ 3 lần xuất hiện trở lên trong chế độ chơi để tránh tỷ lệ sai ảo khi mẫu quá nhỏ.</i>
            </div>

            <!-- Biểu đồ cột ngang Top 10 -->
            <div style="background: #FFFFFF; border: 2px solid #E2E8F0; border-radius: 18px; padding: 12px; margin-bottom: 12px;">
              <div style="font-weight: 800; font-size: 0.95rem; color: #1E293B; margin-bottom: 10px; text-align: left;">
                📈 Top 10 Món Có Tỷ Lệ Sai Cao Nhất (%)
              </div>

              ${stats.top10.length === 0 ? `
                <div style="padding: 20px; color: #64748B; font-weight: 600;">
                  Chưa có dữ liệu (Cần có món rác xuất hiện tối thiểu 3 lần trong chế độ chơi).
                </div>
              ` : stats.top10.map(item => `
                <div class="bar-chart-row">
                  <div class="bar-chart-label" title="${item.name}">
                    <span class="table-mini-icon">${renderWasteItemGraphic(item, 26)}</span>
                    <span>${item.name}</span>
                  </div>
                  <div class="bar-chart-track">
                    <div class="bar-chart-fill" style="width: ${item.wrongRate}%;"></div>
                  </div>
                  <div class="bar-chart-val">${item.wrongRate}%</div>
                </div>
              `).join('')}
            </div>

            <!-- Tỷ lệ sai theo nhóm vật liệu -->
            <div style="background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 18px; padding: 12px; margin-bottom: 12px; text-align: left;">
              <div style="font-weight: 800; font-size: 0.95rem; color: #1E293B; margin-bottom: 8px;">
                📦 Tỷ lệ sai theo Nhóm Vật Liệu:
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px;">
                ${Object.keys(stats.catMap).map(cat => {
                  const c = stats.catMap[cat];
                  const rate = c.total > 0 ? Math.round((c.wrong / c.total) * 100) : 0;
                  return `
                    <div style="background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px; padding: 8px; text-align: center;">
                      <div style="font-size: 0.8rem; color: #64748B; font-weight: 700;">${cat}</div>
                      <div style="font-size: 1.15rem; font-weight: 800; color: ${rate > 40 ? '#DC2626' : '#059669'};">${rate}%</div>
                      <div style="font-size: 0.72rem; color: #9CA3AF;">(${c.wrong}/${c.total})</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Bảng chi tiết -->

      // 7. Bảng Điểm
      function renderLeaderboardScreen() {
        const sessions = getStoredSessions().filter(s => s.mode === 'choi');

        const userBestScore = {};
        sessions.forEach(s => {
          const key = s.nick.trim().toLowerCase();
          if (!userBestScore[key] || s.score > userBestScore[key].score) {
            userBestScore[key] = {
              nick: s.nick,
              group: s.group,
              score: s.score,
              date: s.startTime ? s.startTime.slice(0, 10) : ''
            };
          }
        });

        const top5 = Object.values(userBestScore).sort((a, b) => b.score - a.score).slice(0, 5);

        const userProgressList = [];
        const userSessionGroup = {};
        sessions.forEach(s => {
          const key = s.nick.trim().toLowerCase();
          if (!userSessionGroup[key]) userSessionGroup[key] = [];
          userSessionGroup[key].push(s);
        });

        for (let key in userSessionGroup) {
          const list = userSessionGroup[key];
          if (list.length >= 2) {
            list.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
            const first = list[0];
            const latest = list[list.length - 1];
            const diff = latest.score - first.score;
            userProgressList.push({
              nick: first.nick,
              group: first.group,
              firstScore: first.score,
              latestScore: latest.score,
              diff: diff,
              rounds: list.length
            });
          }
        }

        userProgressList.sort((a, b) => b.diff - a.diff);
        const topImproved = userProgressList.slice(0, 5);

        return `
          <div class="card-box" style="max-width: 540px; margin: auto;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
              <h2 style="font-size: 1.5rem; font-weight: 800; color: #065F46; text-align: left; line-height: 1.35;">

              </h2>

              </button>

              </div>

              ${top5.length === 0 ? `
                <div style="color: #64748B; font-size: 0.9rem; padding: 10px 0;">Chưa có dữ liệu lượt chơi nào.</div>
              ` : `
                <div class="data-table-container">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th>Hạng</th>
                        <th>Biệt danh</th>
                        <th>Lớp/Tổ</th>
                        <th>Điểm cao nhất</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${top5.map((u, idx) => `
                        <tr>
                          <td><b>#${idx + 1} ${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : ''}</b></td>
                          <td><b>${escapeHtml(u.nick)}</b></td>
                          <td>${escapeHtml(u.group || '—')}</td>
                          <td style="color: #059669; font-weight: 800; font-size: 1.05rem;">${u.score}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>

            <!-- Bạn tiến bộ nhất -->
            <div style="background: #F0FDF4; border: 2px solid #86EFAC; border-radius: 18px; padding: 14px; margin-bottom: 14px; text-align: left;">
              <div style="font-weight: 800; font-size: 1.05rem; color: #166534; margin-bottom: 8px;">

              ${topImproved.length === 0 ? `

            <input type="text" id="nickname-input" class="form-input" 
                   value="${escapeHtml(appState.user.nickname)}" 
                   placeholder="Ví dụ: Rùa Nhỏ, Bo Bo, Mèo Con" 
                   maxlength="20" autofocus />

            <div style="text-align: left; margin-bottom: 4px; font-weight: 700; font-size: 0.9rem; color: #374151;">
              Lớp hoặc Tổ (không bắt buộc):
            </div>
            <input type="text" id="class-input" class="form-input" 
                   value="${escapeHtml(appState.user.className)}" 
                   placeholder="Ví dụ: 3A1, Tổ 2, Khối 4" 
                   maxlength="15" />

            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
              <button class="btn-secondary" onclick="goToHome()">
                Quay lại
              </button>
              <button class="btn-primary" onclick="confirmSaveNickname()">
                Xong rồi, vào chơi! 🚀
              </button>
            </div>
          </div>
        `;
      }

      /**
       * =========================================================================
       * KÉO THẢ (DRAG & DROP)
       * =========================================================================
       */
      function setupDragAndDrop() {
        const wasteCard = document.getElementById('waste-card-el');
        const binTargets = document.querySelectorAll('.bin-target');

        if (!wasteCard || !binTargets.length) return;

        wasteCard.addEventListener('dragstart', (e) => {
          if (appState.isAnswerLocked || appState.activeExplanation) {
            e.preventDefault();
            return;
          }
          wasteCard.classList.add('dragging');
          e.dataTransfer.setData('text/plain', 'waste_item');
          e.dataTransfer.effectAllowed = 'move';
        });

        wasteCard.addEventListener('dragend', () => {
          wasteCard.classList.remove('dragging');
        });

        binTargets.forEach((bin) => {
          bin.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            bin.classList.add('drag-over');
          });

          bin.addEventListener('dragleave', () => {
            bin.classList.remove('drag-over');
          });

          bin.addEventListener('drop', (e) => {
            e.preventDefault();
            bin.classList.remove('drag-over');
            const binId = bin.getAttribute('data-bin');
            if (binId) {
              handleChooseBin(binId);
            }
          });
        });
      }

      /**
       * =========================================================================
       * ĐIỀU HƯỚNG VÀ TƯƠNG TÁC
       * =========================================================================
       */
      function goToHome() {
        clearLevel6Timer();
        appState.activeExplanation = null;
        appState.screen = 'home';
        renderApp();
      }

      function goToLevelSelect() {
        initAudio();
        clearLevel6Timer();
        appState.activeExplanation = null;
        appState.screen = 'level_select';
        renderApp();
      }

      function goToConfusedWaste() {
        initAudio();
        clearLevel6Timer();
        appState.screen = 'confused_waste';
        renderApp();
      }

      function goToLeaderboard() {
        initAudio();
        clearLevel6Timer();
        appState.screen = 'leaderboard';
        renderApp();
      }

      function goToTestSetup() {
        initAudio();
        clearLevel6Timer();
        appState.screen = 'test_setup';
        renderApp();
      }

      function goToComparePrePost() {
        initAudio();
        clearLevel6Timer();
        appState.screen = 'compare_pre_post';
        renderApp();
      }

      function goToNicknameSelect() {
        appState.screen = 'nickname_select';
        renderApp();
      }

      function selectAvatar(emoji, name) {
        appState.user.avatar = emoji;
        renderApp();
      }

      function confirmSaveNickname() {
        const nameInput = document.getElementById('nickname-input');
        const classInput = document.getElementById('class-input');

        const newName = nameInput ? nameInput.value.trim() : '';
        const newClass = classInput ? classInput.value.trim() : '';

        if (newName) {
          appState.user.nickname = newName;
        }
        appState.user.className = newClass;
        saveProfile(appState.user);

        appState.turtleMessage = `Hoan hô bạn ${appState.user.nickname}! Sẵn sàng phân loại rác chưa nào?`;
        appState.screen = 'home';
        renderApp();
      }

      function openPauseModal() {
        clearLevel6Timer();
        appState.previousScreen = appState.screen;
        appState.screen = 'paused';
        renderApp();
      }

      function resumeGame() {
        appState.screen = 'playing';
        appState.itemStartTime = Date.now();
        renderApp();

        if (appState.currentLevel === 6 && appState.gameMode === 'choi') {
          startLevel6QuestionTimer();
        }
      }

      function confirmExitGame() {
        if (confirm('Bé có chắc muốn thoát lượt chơi hiện tại không?')) {
          goToHome();
        }
      }

      function toggleSound() {
        initAudio();
        soundEnabled = !soundEnabled;
        try {
          localStorage.setItem(STORAGE_KEYS.SOUND_PREF, soundEnabled ? 'true' : 'false');
        } catch (e) {}
        renderApp();
      }

      function pokeTurtle() {
        initAudio();
        playTone(440, 'triangle', 0.1, 0, 0.15);
        const turtlePhrases = [
          'Hộp sữa giấy rửa sạch ép dẹp là tái chế được đấy bé nhé! 🧃',
          'Vỏ nghêu sò và xương lớn cứng khó phân hủy nên vào rác còn lại nha! 🦪',
          'Cốc giấy uống nước có lớp màng nhựa chống thấm dính chặt khó tái chế! 🥤',
          'Khăn giấy ăn bẩn và giấy dính dầu mỡ phải bỏ vào thùng Rác còn lại! 🧻',
          'Bé đạt Cấp 6 Thử Thách Thời Gian sẽ nhận danh hiệu Chiến Binh Xanh cực ngầu! 🛡️'
        ];
        const randomPhrase = turtlePhrases[Math.floor(Math.random() * turtlePhrases.length)];
        appState.turtleMessage = randomPhrase;
        renderApp();
      }

      function escapeHtml(text) {
        if (!text) return '';
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      /**
       * =========================================================================
       * KHỞI ĐỘNG ỨNG DỤNG
       * =========================================================================
       */
      window.addEventListener('DOMContentLoaded', () => {
        const saved = getSavedProfile();
        if (saved && saved.nickname) {
          appState.user = { ...appState.user, ...saved };
        }

        // Tự động kiểm tra tính hợp lệ dữ liệu ngay khi khởi động
        validateWasteDatabase();

        renderApp();
      });
    </script>
  </body>
</html>
